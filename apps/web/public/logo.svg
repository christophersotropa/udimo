    .outline { stroke: #1a1a1a; }
    @media (prefers-color-scheme: dark) { .outline { stroke: #ffffff; } }
  </style>
  <rect class="outline" x="2.5" y="2.5" width="22" height="22" fill="none" stroke-width="3"/>
  <rect x="11" y="11" width="20" height="20" fill="#f0a93b"/>
</svg>
